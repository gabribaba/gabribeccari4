<div id="free-palestine">
    <img src="free_palestine.png" alt="Intro Image">
    <button id="enter-btn" type="button" class="btn btn-outline-warning" 
    style="margin-top: 0.5rem;">
        Continue to site
    </button>
</div>

<style>
    #free-palestine {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.6s ease;
    }

    #free-palestine img {
        max-width: 90%;
        max-height: 90vh;
        object-fit: contain;
    }

    #free-palestine.hidden {
        opacity: 0;
        pointer-events: none;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const overlay = document.getElementById("free-palestine");
        const btn = document.getElementById("enter-btn");

        if (sessionStorage.getItem("introSeen")) {
            overlay.classList.add("hidden");
        }

        btn.addEventListener("click", () => {
            overlay.classList.add("hidden");
            sessionStorage.setItem("introSeen", "true");
        });
    });
</script>
